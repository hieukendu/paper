experiment_id: deployment_default_v1
purpose: >-
  Operational-reference comparison for figures and ablations. These runs are
  intentionally fixed-budget, single-seed configurations, not replacements for
  the tuned/published baseline upper bounds.
reporting_rule: >-
  Label every resulting table/figure as deployment-default. Do not claim that
  it supersedes, reproduces, or is directly comparable to the best-tuned
  baseline results.
hardware:
  accelerator: NVIDIA H100 MIG 20GB
  precision: bf16
  seed: 20260730
data:
  train: data/processed/vipragsent_train.jsonl
  development: data/processed/vipragsent_dev.jsonl
  test: data/processed/vipragsent_test.jsonl
  test_selection: forbidden
encoder_defaults:
  epochs: 3
  early_stopping_patience: 3
  learning_rate: 2.0e-5
  max_sequence_length: 128
  batch_size: 16
  gradient_accumulation: 2
  pooling: cls
  dropout: 0.1
  auxiliary_tasks: false
  uncertainty_weighting: false
  class_reweighting: false
  threshold: 0.5
qlora_defaults:
  train_records: 512
  epochs: 1
  max_train_batches: 64
  learning_rate: 1.0e-4
  max_sequence_length: 128
  batch_size: 8
  gradient_accumulation: 1
  lora_rank: 8
  lora_alpha: 16
  lora_dropout: 0.05
  class_reweighting: false
  threshold: 0.5
systems:
  - phobert_default
  - visobert_default
  - xlmr_large_default
  - vistral_7b_default
  - sailor_7b_default
